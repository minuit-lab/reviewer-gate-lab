name: tests

on: [push, pull_request]

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gate, golden set and eval prompt tests (no model, no API key)
        run: python3 -m unittest discover -s tests -v
      - name: Bypass attempts of case 3 (no model)
        run: python3 demo/cas_pratiques.py --sans-modele
